# Course template - Lab 1 compose contract (API.md section 9).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need
# no network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # Lab 3, MONITORING-SPEC.md M-02
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    depends_on:
      - kb-index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Lab 3 (M-01): the course's knowledge-base index. Its latency and error profile is derived from the GitHub login
  # below; the checker and the grader replace the image and the login with their own.
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: cresixu
    ports:
      - "8081:8080"               # optional: /stats and /admin/degrade from the laptop
    # No healthcheck: the image has no shell, so a check that runs a command inside it never passes (L3-CORE-1.04).

  # Lab 3: my own Prometheus and Grafana, started only with `docker compose --profile observability up -d`.
  # The checker never starts them, so they may bind-mount their configuration (L3-CORE-1.02 looks at svcdesk and
  # kb-index only).
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  # Lab 3, Stretch 2 (M-30): Toxiproxy in front of svcdesk, started with `docker compose --profile gap up -d toxiproxy`.
  # The proxy "svcdesk" (listen 0.0.0.0:8666, upstream svcdesk:8080) and its latency toxic are created through the API
  # on 8474 (gap/README.md has the two calls).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"
      - "8666:8666"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Stretch S3 (own tests, Lab 1 and Lab 2): docker compose --profile tests run --rm --build tests
  # runs src/tests/run.py, a pytest suite driven over HTTP against the svcdesk service, and prints
  # "ITSMLAB-TESTS: passed=<n> failed=0" as its last line.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # your tests read the service URL from this variable
      SVCDESK_FIXTURES_DIR: /app/fixtures
    command: ["python", "-m", "tests.run"]   # your runner: runs the suite, prints the ITSMLAB-TESTS line last

volumes:
  svcdesk-data:
